<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020710"/>
      <stop offset="40%" stop-color="#061628"/>
      <stop offset="75%" stop-color="#0B233D"/>
      <stop offset="100%" stop-color="#040C18"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143454"/>
      <stop offset="100%" stop-color="#081829"/>
    </linearGradient>
    <linearGradient id="mountMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A4269"/>
      <stop offset="50%" stop-color="#0E2741"/>
      <stop offset="100%" stop-color="#05121F"/>
    </linearGradient>
    <linearGradient id="mountSnow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glowing Rim Gradients -->
    <linearGradient id="cyanMintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#27E6A2"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Fog Gradient -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030A14" stop-opacity="0"/>
      <stop offset="70%" stop-color="#030A14" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030A14" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Circular Avatar Clip -->
    <clipPath id="avatarClip">
      <circle cx="130" cy="205" r="82"/>
    </clipPath>

    <!-- Handwritten Font Shadow -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .hand { font-family: "Caveat", "Brush Script MT", "Segoe Script", "Comic Sans MS", cursive, sans-serif; font-style: italic; }
  </style>

  <!-- Sky & Stars Background -->
  <rect width="1200" height="420" fill="url(#heroSky)"/>

  <!-- Stars -->
  <g opacity="0.65">
    <circle cx="180" cy="45" r="1.5" fill="#E8F0FA"/>
    <circle cx="340" cy="30" r="1" fill="#38BDF8"/>
    <circle cx="510" cy="55" r="1.5" fill="#FFFFFF"/>
    <circle cx="680" cy="35" r="1" fill="#27E6A2"/>
    <circle cx="820" cy="60" r="1.5" fill="#38BDF8"/>
    <circle cx="950" cy="40" r="2" fill="#FFFFFF"/>
    <circle cx="1060" cy="70" r="1" fill="#27E6A2"/>
    <circle cx="1140" cy="35" r="1.5" fill="#FFFFFF"/>
    <circle cx="880" cy="110" r="1" fill="#E8F0FA"/>
    <circle cx="730" cy="95" r="1.2" fill="#38BDF8"/>
  </g>

  <!-- Distant Background Mountain Silhouettes (Right & Center) -->
  <path d="M 450 320 L 580 210 L 670 260 L 780 160 L 890 230 L 1000 130 L 1110 200 L 1200 150 L 1200 420 L 450 420 Z" fill="url(#mountFar)" opacity="0.85"/>
  <path d="M 780 160 L 805 195 L 830 185 L 890 230 L 920 200 L 1000 130 L 1030 170 L 1080 155 L 1110 200" fill="none" stroke="#7DD3FC" stroke-width="1.2" opacity="0.4"/>

  <!-- Midground Mountains with Snow Ridges -->
  <path d="M 520 360 L 650 250 L 760 300 L 880 190 L 990 260 L 1100 170 L 1200 230 L 1200 420 L 520 420 Z" fill="url(#mountMid)"/>

  <!-- Snow Highlights on Peaks -->
  <polygon points="880,190 855,230 870,225 880,240 905,215" fill="url(#mountSnow)" opacity="0.75"/>
  <polygon points="1100,170 1075,210 1090,205 1105,225 1125,195" fill="url(#mountSnow)" opacity="0.8"/>
  <polygon points="650,250 635,275 645,270 655,285 668,268" fill="url(#mountSnow)" opacity="0.6"/>

  <!-- Glowing Ridge Lines -->
  <path d="M 650 250 L 760 300 L 880 190 L 990 260 L 1100 170 L 1200 230" fill="none" stroke="url(#cyanMintGlow)" stroke-width="2" opacity="0.6"/>

  <!-- Atmosphere / Fog Overlay at base -->
  <rect y="240" width="1200" height="180" fill="url(#fogGrad)"/>

  <!-- ================= LEFT: CIRCULAR AVATAR ================= -->
  <!-- Outer Glow Ring -->
  <circle cx="130" cy="205" r="88" fill="none" stroke="url(#cyanMintGlow)" stroke-width="3.5" filter="url(#mintGlow)"/>
  <circle cx="130" cy="205" r="84" fill="#040D18"/>

  <!-- Mountain Artwork Inside Avatar -->
  <g clip-path="url(#avatarClip)">
    <rect x="40" y="115" width="180" height="180" fill="#0A223B"/>
    <!-- Avatar Sky -->
    <path d="M 40 220 L 90 175 L 120 195 L 150 145 L 180 185 L 220 150 L 220 300 L 40 300 Z" fill="#0E2F52"/>
    <!-- Avatar Main Mountain Peak -->
    <polygon points="130,135 70,245 190,245" fill="#143C66"/>
    <!-- Snow Cap Left Face -->
    <polygon points="130,135 105,185 130,175 125,200 130,245 70,245" fill="#38BDF8" opacity="0.9"/>
    <!-- Snow Cap Right Sunlight -->
    <polygon points="130,135 150,180 138,190 155,210 130,245 190,245" fill="#E0F2FE"/>
    <!-- Ridge Line Crest -->
    <path d="M 130 135 L 132 170 L 126 195 L 130 245" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="170" cy="145" r="1.5" fill="#FFFFFF"/>
    <circle cx="85" cy="155" r="1" fill="#7DD3FC"/>
  </g>

  <!-- ================= CENTER: HERO TEXT & BADGES ================= -->
  <g transform="translate(248, 85)">
    <!-- Hi, I'm -->
    <text x="0" y="32" class="sans" font-size="20" font-weight="500" fill="#CBD5E1" letter-spacing="0.5">Hi, I'm</text>

    <!-- Name: Indra Singh Jeena -->
    <text x="0" y="80" class="sans" font-size="44" font-weight="900" letter-spacing="1">
      <tspan fill="#FFFFFF">Indra </tspan>
      <tspan fill="#27E6A2">Singh </tspan>
      <tspan fill="#38BDF8">Jeena</tspan>
    </text>

    <!-- Role Statement -->
    <text x="0" y="116" class="sans" font-size="16.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.8">
      Full-Stack Developer <tspan fill="#64748B">|</tspan> MERN Stack <tspan fill="#64748B">|</tspan> Java &amp; DSA
    </text>

    <!-- Bio Description -->
    <text x="0" y="150" class="sans" font-size="13.5" fill="#94A3B8" font-weight="400">
      <tspan x="0" dy="0">I'm a Computer Science Engineering student passionate about</tspan>
      <tspan x="0" dy="20">building modern web applications, solving real-world problems,</tspan>
      <tspan x="0" dy="20">and growing as a developer.</tspan>
    </text>

    <!-- 4 Social Action Buttons (Exact Recreation of Reference) -->
    <g transform="translate(0, 222)">
      <!-- 1. Portfolio Button (Mint Outline) -->
      <a href="https://indrasingh29.github.io/indra-portfolio/">
        <rect x="0" y="0" width="112" height="34" rx="8" fill="#04201A" stroke="#27E6A2" stroke-width="1.5"/>
        <!-- Web / Screen Icon -->
        <g transform="translate(14, 9)">
          <rect x="0" y="0" width="16" height="12" rx="2" fill="none" stroke="#27E6A2" stroke-width="1.5"/>
          <line x1="0" y1="4" x2="16" y2="4" stroke="#27E6A2" stroke-width="1"/>
          <circle cx="3" cy="2" r="0.8" fill="#27E6A2"/>
          <circle cx="6" cy="2" r="0.8" fill="#27E6A2"/>
          <line x1="5" y1="15" x2="11" y2="15" stroke="#27E6A2" stroke-width="1.5"/>
          <line x1="8" y1="12" x2="8" y2="15" stroke="#27E6A2" stroke-width="1.5"/>
        </g>
        <text x="38" y="22" class="sans" font-size="12.5" font-weight="700" fill="#27E6A2">Portfolio</text>
      </a>

      <!-- 2. LinkedIn Button (Blue) -->
      <a href="https://www.linkedin.com/in/indra-singh-jeena-1a9542216">
        <g transform="translate(124, 0)">
          <rect x="0" y="0" width="112" height="34" rx="8" fill="#0A66C2"/>
          <!-- LinkedIn in Icon -->
          <g transform="translate(14, 9)">
            <rect x="0" y="0" width="15" height="15" rx="3" fill="#FFFFFF"/>
            <text x="7.5" y="11.5" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="900" fill="#0A66C2">in</text>
          </g>
          <text x="38" y="22" class="sans" font-size="12.5" font-weight="700" fill="#FFFFFF">LinkedIn</text>
        </g>
      </a>

      <!-- 3. GitHub Button (Dark Navy) -->
      <a href="https://github.com/indrasingh29">
        <g transform="translate(248, 0)">
          <rect x="0" y="0" width="104" height="34" rx="8" fill="#091A2B" stroke="#1E3A52" stroke-width="1.2"/>
          <!-- Octocat Icon -->
          <g transform="translate(14, 8)">
            <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.09 10 14.95 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#FFFFFF"/>
          </g>
          <text x="38" y="22" class="sans" font-size="12.5" font-weight="600" fill="#FFFFFF">GitHub</text>
        </g>
      </a>

      <!-- 4. Email Button (Dark Navy) -->
      <a href="mailto:indrasinghjeena@gmail.com">
        <g transform="translate(364, 0)">
          <rect x="0" y="0" width="98" height="34" rx="8" fill="#091A2B" stroke="#1E3A52" stroke-width="1.2"/>
          <!-- Mail Icon -->
          <g transform="translate(14, 10)">
            <rect x="0" y="0" width="16" height="12" rx="2" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
            <path d="M 0 2 L 8 8 L 16 2" fill="none" stroke="#22D3EE" stroke-width="1.3"/>
          </g>
          <text x="38" y="22" class="sans" font-size="12.5" font-weight="600" fill="#E2E8F0">Email</text>
        </g>
      </a>
    </g>
  </g>

  <!-- ================= RIGHT: HANDWRITTEN SLOGAN ================= -->
  <g transform="translate(930, 95)">
    <text x="40" y="30" class="hand" font-size="36" fill="#27E6A2" font-weight="700" letter-spacing="1" transform="rotate(-6 40 30)" filter="url(#mintGlow)">Better</text>
    <text x="65" y="68" class="hand" font-size="34" fill="#27E6A2" font-weight="700" letter-spacing="1" transform="rotate(-6 65 68)" filter="url(#mintGlow)">Code</text>
    <text x="75" y="112" class="hand" font-size="36" fill="#27E6A2" font-weight="700" letter-spacing="1" transform="rotate(-6 75 112)" filter="url(#mintGlow)">Bigger</text>
    <text x="100" y="152" class="hand" font-size="38" fill="#27E6A2" font-weight="700" letter-spacing="1" transform="rotate(-6 100 152)" filter="url(#mintGlow)">Dreams</text>

    <!-- Curved Underline Flourish -->
    <path d="M 50 178 Q 120 195 190 148" fill="none" stroke="#27E6A2" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#mintGlow)"/>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect y="417" width="1200" height="3" fill="url(#cyanMintGlow)"/>
</svg>
