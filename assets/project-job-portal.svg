<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A2C"/>
      <stop offset="100%" stop-color="#030C16"/>
    </linearGradient>
    <linearGradient id="mintGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27E6A2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="cardGrid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#183044" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="600" height="260" rx="12" fill="url(#cardBg1)" stroke="#183044" stroke-width="1.5"/>
  <rect width="600" height="260" rx="12" fill="url(#cardGrid1)"/>

  <!-- Top Window Header -->
  <rect width="600" height="36" rx="12" fill="#0A2035" stroke="#183044" stroke-width="1"/>
  <rect y="24" width="600" height="12" fill="#0A2035"/>
  <circle cx="22" cy="18" r="4.5" fill="#FF5F56"/>
  <circle cx="36" cy="18" r="4.5" fill="#FFBD2E"/>
  <circle cx="50" cy="18" r="4.5" fill="#27C93F"/>
  <text x="70" y="22" class="mono" font-size="11" fill="#9CB0C8">job-internship-portal // production-deploy</text>

  <!-- Status Pill -->
  <rect x="440" y="8" width="144" height="20" rx="10" fill="#061826" stroke="#27E6A2" stroke-width="1"/>
  <circle cx="452" cy="18" r="3.5" fill="#27E6A2"/>
  <text x="462" y="22" class="mono" font-size="9.5" fill="#27E6A2" font-weight="700">RENDER LIVE (200)</text>

  <!-- Project Icon / Graphic (Left side) -->
  <g transform="translate(36, 64)">
    <rect width="90" height="90" rx="16" fill="#0A2238" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Briefcase & Career Portal Vector Icon -->
    <path d="M 28 36 L 62 36 L 62 70 L 28 70 Z" fill="none" stroke="#27E6A2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 38 36 L 38 28 C 38 24 52 24 52 28 L 52 36" fill="none" stroke="#22D3EE" stroke-width="2.2"/>
    <path d="M 28 48 L 62 48" stroke="#183044" stroke-width="2"/>
    <circle cx="45" cy="54" r="3" fill="#27E6A2"/>
    <!-- Pulse Waves -->
    <circle cx="45" cy="45" r="32" fill="none" stroke="#27E6A2" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Project Info (Right of Icon) -->
  <g transform="translate(144, 66)">
    <!-- Badge -->
    <rect x="0" y="0" width="190" height="20" rx="4" fill="#061D2E" stroke="#27E6A2" stroke-width="0.8"/>
    <text x="8" y="14" class="mono" font-size="10" fill="#27E6A2" font-weight="700">MERN · B.TECH MINOR PROJECT</text>

    <!-- Project Name -->
    <text x="0" y="44" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">Job &amp; Internship Portal</text>

    <!-- Description -->
    <text x="0" y="68" class="sans" font-size="12.5" fill="#9CB0C8">Ecosystem for Students, Recruiters &amp; Admin Moderation</text>

    <!-- Metrics / Key Highlights -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#0A2136"/>
      <text x="6" y="15" class="mono" font-size="10" fill="#22D3EE">✓ 50-Company Directory</text>

      <rect x="138" y="0" width="138" height="22" rx="4" fill="#0A2136"/>
      <text x="144" y="15" class="mono" font-size="10" fill="#22D3EE">✓ Role-Based JWT Auth</text>

      <rect x="284" y="0" width="134" height="22" rx="4" fill="#0A2136"/>
      <text x="290" y="15" class="mono" font-size="10" fill="#22D3EE">✓ Application Tracker</text>
    </g>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(36, 212)">
    <text x="0" y="16" class="mono" font-size="11" fill="#9CB0C8">STACK:</text>
    <rect x="52" y="0" width="70" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="87" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">React 18</text>

    <rect x="128" y="0" width="76" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="166" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Node.js</text>

    <rect x="210" y="0" width="80" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="250" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Express</text>

    <rect x="296" y="0" width="92" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="342" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">MongoDB</text>

    <rect x="394" y="0" width="84" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="436" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Tailwind</text>

    <rect x="484" y="0" width="80" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="524" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#27E6A2">Render</text>
  </g>

  <!-- Accent bottom glow line -->
  <rect x="0" y="257" width="600" height="3" fill="url(#mintGrad1)"/>
</svg>
