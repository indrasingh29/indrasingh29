<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="jpCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D2D"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <!-- Container -->
  <rect width="600" height="320" rx="14" fill="url(#jpCardBg)" stroke="#162E44" stroke-width="1.5"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(18, 16)" filter="url(#softShadow)">
    <!-- Browser Frame -->
    <rect width="564" height="288" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="564" height="28" rx="10" fill="#1E293B"/>
    <rect y="18" width="564" height="10" fill="#1E293B"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="14" r="4" fill="#10B981"/>
    <!-- URL pill -->
    <rect x="140" y="6" width="284" height="16" rx="4" fill="#0F172A"/>
    <text x="282" y="18" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">job-portal-web.onrender.com</text>

    <!-- App Content Area (Dashboard with green theme like in screenshot) -->
    <g transform="translate(0, 28)">
      <!-- Left Sidebar (Dark Navy/Green) -->
      <rect width="115" height="260" fill="#061822"/>
      <rect x="14" y="14" width="86" height="18" rx="4" fill="#047857"/>
      <text x="57" y="26" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#ECFDF5">JobPortal</text>

      <!-- Sidebar Menu Items -->
      <g transform="translate(14, 46)">
        <rect x="0" y="0" width="86" height="16" rx="3" fill="#10B981" fill-opacity="0.15"/>
        <circle cx="8" cy="8" r="2.5" fill="#10B981"/>
        <text x="16" y="11" class="sans" font-size="8.5" font-weight="600" fill="#10B981">Find Jobs</text>

        <rect x="0" y="22" width="86" height="16" rx="3" fill="transparent"/>
        <circle cx="8" cy="30" r="2.5" fill="#64748B"/>
        <text x="16" y="33" class="sans" font-size="8.5" fill="#94A3B8">Companies</text>

        <rect x="0" y="44" width="86" height="16" rx="3" fill="transparent"/>
        <circle cx="8" cy="52" r="2.5" fill="#64748B"/>
        <text x="16" y="55" class="sans" font-size="8.5" fill="#94A3B8">Applied (8)</text>

        <rect x="0" y="66" width="86" height="16" rx="3" fill="transparent"/>
        <circle cx="8" cy="74" r="2.5" fill="#64748B"/>
        <text x="16" y="77" class="sans" font-size="8.5" fill="#94A3B8">Bookmarks</text>
      </g>

      <!-- Main Dashboard Area (Light / Clean like in reference screenshot) -->
      <rect x="115" width="449" height="260" fill="#F8FAFC"/>

      <!-- Dashboard Header / Search -->
      <g transform="translate(132, 14)">
        <text x="0" y="14" class="sans" font-size="12" font-weight="800" fill="#0F172A">Explore 50+ Verified Openings</text>
        <rect x="0" y="24" width="310" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="10" y="40" class="sans" font-size="8.5" fill="#94A3B8">🔍 Search by role, skill, or MNC company...</text>
        <rect x="318" y="24" width="94" height="24" rx="4" fill="#047857"/>
        <text x="365" y="40" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#FFFFFF">Filter Jobs</text>
      </g>

      <!-- Job Cards Grid in Content -->
      <g transform="translate(132, 74)">
        <!-- Job Card 1 -->
        <rect x="0" y="0" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="10" y="10" width="22" height="22" rx="4" fill="#10B981" fill-opacity="0.2"/>
        <text x="21" y="24" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#047857">G</text>
        <text x="38" y="20" class="sans" font-size="10" font-weight="700" fill="#0F172A">Frontend Engineer</text>
        <text x="38" y="30" class="sans" font-size="8" fill="#64748B">Google · Bangalore · Full-time</text>
        <rect x="10" y="48" width="46" height="14" rx="3" fill="#ECFDF5"/>
        <text x="33" y="58" text-anchor="middle" class="sans" font-size="7.5" font-weight="600" fill="#047857">React.js</text>
        <rect x="60" y="48" width="44" height="14" rx="3" fill="#F1F5F9"/>
        <text x="82" y="58" text-anchor="middle" class="sans" font-size="7.5" fill="#475569">MERN</text>
        <rect x="150" y="48" width="42" height="16" rx="3" fill="#047857"/>
        <text x="171" y="59" text-anchor="middle" class="sans" font-size="8" font-weight="600" fill="#FFFFFF">Apply</text>

        <!-- Job Card 2 -->
        <rect x="212" y="0" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="222" y="10" width="22" height="22" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
        <text x="233" y="24" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#1D4ED8">M</text>
        <text x="250" y="20" class="sans" font-size="10" font-weight="700" fill="#0F172A">Software Intern</text>
        <text x="250" y="30" class="sans" font-size="8" fill="#64748B">Microsoft · Remote · 6 Mos</text>
        <rect x="222" y="48" width="40" height="14" rx="3" fill="#EFF6FF"/>
        <text x="242" y="58" text-anchor="middle" class="sans" font-size="7.5" font-weight="600" fill="#1D4ED8">Java</text>
        <rect x="266" y="48" width="40" height="14" rx="3" fill="#F1F5F9"/>
        <text x="286" y="58" text-anchor="middle" class="sans" font-size="7.5" fill="#475569">DSA</text>
        <rect x="362" y="48" width="42" height="16" rx="3" fill="#047857"/>
        <text x="383" y="59" text-anchor="middle" class="sans" font-size="8" font-weight="600" fill="#FFFFFF">Apply</text>

        <!-- Job Card 3 (Bottom Row) -->
        <rect x="0" y="84" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="10" y="94" width="22" height="22" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
        <text x="21" y="108" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#B45309">A</text>
        <text x="38" y="104" class="sans" font-size="10" font-weight="700" fill="#0F172A">Node.js Developer</text>
        <text x="38" y="114" class="sans" font-size="8" fill="#64748B">Amazon · Hyderabad</text>
        <rect x="10" y="128" width="50" height="14" rx="3" fill="#FEF3C7"/>
        <text x="35" y="138" text-anchor="middle" class="sans" font-size="7.5" font-weight="600" fill="#92400E">Express</text>
        <rect x="150" y="128" width="42" height="16" rx="3" fill="#047857"/>
        <text x="171" y="139" text-anchor="middle" class="sans" font-size="8" font-weight="600" fill="#FFFFFF">Apply</text>

        <!-- Job Card 4 (Bottom Row) -->
        <rect x="212" y="84" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="222" y="94" width="22" height="22" rx="4" fill="#8B5CF6" fill-opacity="0.2"/>
        <text x="233" y="108" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#6D28D9">Z</text>
        <text x="250" y="104" class="sans" font-size="10" font-weight="700" fill="#0F172A">Backend Trainee</text>
        <text x="250" y="114" class="sans" font-size="8" fill="#64748B">Zomato · Gurgaon</text>
        <rect x="222" y="128" width="52" height="14" rx="3" fill="#F5F3FF"/>
        <text x="248" y="138" text-anchor="middle" class="sans" font-size="7.5" font-weight="600" fill="#6D28D9">MongoDB</text>
        <rect x="362" y="128" width="42" height="16" rx="3" fill="#047857"/>
        <text x="383" y="139" text-anchor="middle" class="sans" font-size="8" font-weight="600" fill="#FFFFFF">Apply</text>
      </g>
    </g>
  </g>
</svg>
