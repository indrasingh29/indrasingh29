<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="raCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D2D"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <filter id="raShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <!-- Container -->
  <rect width="600" height="320" rx="14" fill="url(#raCardBg)" stroke="#162E44" stroke-width="1.5"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(18, 16)" filter="url(#raShadow)">
    <!-- Browser Frame -->
    <rect width="564" height="288" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="564" height="28" rx="10" fill="#1E293B"/>
    <rect y="18" width="564" height="10" fill="#1E293B"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="14" r="4" fill="#10B981"/>
    <!-- URL pill -->
    <rect x="140" y="6" width="284" height="16" rx="4" fill="#0F172A"/>
    <text x="282" y="18" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">ai-resume-analyzer.onrender.com</text>

    <!-- App Content: Exact Recreation of Resume Analyzer in reference! -->
    <g transform="translate(0, 28)">
      <!-- Clean White App Background -->
      <rect width="564" height="260" fill="#FFFFFF"/>

      <!-- App Header -->
      <g transform="translate(282, 32)" text-anchor="middle">
        <text y="0" class="sans" font-size="18" font-weight="900" fill="#0F172A">AI Resume Analyzer</text>
        <text y="18" class="sans" font-size="9.5" fill="#64748B">Instant ATS Compatibility Scoring, Keyword Extraction &amp; Interview Prep</text>
      </g>

      <!-- Center Upload Box with Dashed Border (Exact match from reference!) -->
      <g transform="translate(112, 65)">
        <rect width="340" height="105" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
        
        <!-- Upload Icon -->
        <g transform="translate(170, 32)">
          <circle cx="0" cy="0" r="16" fill="#EFF6FF"/>
          <path d="M 0 6 L 0 -6 M -5 -1 L 0 -6 L 5 -1" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        
        <text x="170" y="65" text-anchor="middle" class="sans" font-size="10" font-weight="600" fill="#1E293B">Drop your PDF resume here or browse files</text>
        <text x="170" y="78" text-anchor="middle" class="sans" font-size="8" fill="#94A3B8">Supports PDF format up to 5MB (Secure &amp; Encrypted)</text>

        <!-- Blue Action Button inside Upload box (As in reference image!) -->
        <rect x="115" y="86" width="110" height="18" rx="4" fill="#2563EB"/>
        <text x="170" y="99" text-anchor="middle" class="sans" font-size="8.5" font-weight="700" fill="#FFFFFF">Select PDF Resume</text>
      </g>

      <!-- Analysis Results & Telemetry Preview at Bottom -->
      <g transform="translate(36, 185)">
        <!-- ATS Score Card -->
        <rect x="0" y="0" width="150" height="58" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="30" cy="29" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
        <text x="30" y="34" text-anchor="middle" class="sans" font-size="11" font-weight="900" fill="#047857">88%</text>
        <text x="58" y="24" class="sans" font-size="9.5" font-weight="700" fill="#0F172A">ATS Match</text>
        <text x="58" y="38" class="sans" font-size="7.5" fill="#10B981">● Excellent Format</text>

        <!-- Keywords Found Card -->
        <rect x="170" y="0" width="160" height="58" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="20" class="sans" font-size="9" font-weight="700" fill="#0F172A">Top Keywords Detected</text>
        <g transform="translate(14, 28)">
          <rect x="0" y="0" width="38" height="14" rx="2" fill="#EFF6FF"/>
          <text x="19" y="10" text-anchor="middle" class="sans" font-size="7" font-weight="600" fill="#2563EB">React</text>
          <rect x="42" y="0" width="36" height="14" rx="2" fill="#ECFDF5"/>
          <text x="60" y="10" text-anchor="middle" class="sans" font-size="7" font-weight="600" fill="#047857">Node</text>
          <rect x="82" y="0" width="46" height="14" rx="2" fill="#F5F3FF"/>
          <text x="105" y="10" text-anchor="middle" class="sans" font-size="7" font-weight="600" fill="#6D28D9">MongoDB</text>
        </g>
        <text x="14" y="52" class="sans" font-size="7.5" fill="#64748B">+8 technical proficiencies mapped</text>

        <!-- Interview Prep Questions Card -->
        <rect x="350" y="0" width="142" height="58" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="20" class="sans" font-size="9" font-weight="700" fill="#0F172A">Interview Questions</text>
        <text x="14" y="34" class="sans" font-size="7.5" fill="#64748B">"Explain MERN JWT security..."</text>
        <text x="14" y="48" class="sans" font-size="7.5" font-weight="700" fill="#2563EB">View 5 Generated Qs →</text>
      </g>
    </g>
  </g>
</svg>
