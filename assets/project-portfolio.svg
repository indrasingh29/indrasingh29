<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D2D"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="portHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030814"/>
      <stop offset="60%" stop-color="#081A2F"/>
      <stop offset="100%" stop-color="#050F1D"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#27E6A2"/>
    </linearGradient>
    <filter id="portShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <!-- Container -->
  <rect width="600" height="320" rx="14" fill="url(#portBg)" stroke="#162E44" stroke-width="1.5"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(18, 16)" filter="url(#portShadow)">
    <!-- Browser Frame -->
    <rect width="564" height="288" rx="10" fill="#0A1626" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="564" height="28" rx="10" fill="#152436"/>
    <rect y="18" width="564" height="10" fill="#152436"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="14" r="4" fill="#10B981"/>
    <!-- URL pill -->
    <rect x="140" y="6" width="284" height="16" rx="4" fill="#08121E"/>
    <text x="282" y="18" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">indrasingh29.github.io/indra-portfolio</text>

    <!-- App Content: Exact Miniature of the Portfolio Hero! -->
    <g transform="translate(0, 28)">
      <rect width="564" height="260" fill="url(#portHeroBg)"/>

      <!-- Top Nav in app -->
      <g transform="translate(24, 12)">
        <text x="0" y="14" class="mono" font-size="10" font-weight="700" fill="#E2E8F0">&lt;ISJ /&gt;</text>
        <g transform="translate(360, 4)">
          <text x="0" y="10" class="sans" font-size="8.5" fill="#94A3B8">About</text>
          <text x="40" y="10" class="sans" font-size="8.5" fill="#94A3B8">Projects</text>
          <text x="88" y="10" class="sans" font-size="8.5" fill="#94A3B8">Skills</text>
          <rect x="124" y="-3" width="46" height="16" rx="3" fill="#27E6A2" fill-opacity="0.15" stroke="#27E6A2" stroke-width="0.8"/>
          <text x="147" y="9" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="#27E6A2">Resume</text>
        </g>
      </g>

      <!-- Mountain Silhouettes in portfolio hero background -->
      <path d="M 220 220 L 300 160 L 370 190 L 440 130 L 510 180 L 564 140 L 564 260 L 220 260 Z" fill="#0E2845" opacity="0.8"/>
      <path d="M 280 240 L 350 180 L 420 220 L 490 160 L 564 200 L 564 260 L 280 260 Z" fill="#14395E"/>
      <polygon points="440,130 425,160 435,155 440,165 455,148" fill="#7DD3FC" opacity="0.8"/>
      <polygon points="490,160 475,190 485,185 490,195 505,178" fill="#7DD3FC" opacity="0.8"/>

      <!-- Circular Avatar Frame -->
      <g transform="translate(40, 60)">
        <circle cx="48" cy="48" r="48" fill="none" stroke="url(#glowBorder)" stroke-width="2.5"/>
        <circle cx="48" cy="48" r="45" fill="#081C30"/>
        <!-- Mountain inside avatar -->
        <polygon points="48,15 15,75 80,75" fill="#173F68"/>
        <polygon points="48,15 32,45 48,40 45,55 48,75 15,75" fill="#38BDF8"/>
        <polygon points="48,15 62,42 54,48 65,60 48,75 80,75" fill="#E0F2FE"/>
      </g>

      <!-- Typography -->
      <g transform="translate(160, 65)">
        <text x="0" y="16" class="sans" font-size="11" fill="#94A3B8">Hi, I'm</text>
        <text x="0" y="44" class="sans" font-size="24" font-weight="900">
          <tspan fill="#FFFFFF">Indra </tspan>
          <tspan fill="#27E6A2">Singh </tspan>
          <tspan fill="#38BDF8">Jeena</tspan>
        </text>
        <text x="0" y="66" class="sans" font-size="10.5" font-weight="600" fill="#E2E8F0">
          Full-Stack Developer | MERN Stack | Java &amp; DSA
        </text>

        <!-- Buttons Row -->
        <g transform="translate(0, 85)">
          <rect x="0" y="0" width="70" height="22" rx="4" fill="#04201A" stroke="#27E6A2" stroke-width="1"/>
          <text x="35" y="15" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#27E6A2">Portfolio</text>

          <rect x="78" y="0" width="70" height="22" rx="4" fill="#0A66C2"/>
          <text x="113" y="15" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#FFFFFF">LinkedIn</text>

          <rect x="156" y="0" width="65" height="22" rx="4" fill="#0D2034" stroke="#1E3A52" stroke-width="1"/>
          <text x="188" y="15" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#FFFFFF">GitHub</text>
        </g>
      </g>

      <!-- Animated Project Showcase Cards Mockup at Bottom -->
      <g transform="translate(40, 185)">
        <rect x="0" y="0" width="155" height="60" rx="6" fill="#091A2B" stroke="#1E3A52" stroke-width="1"/>
        <text x="12" y="18" class="sans" font-size="9" font-weight="700" fill="#27E6A2">⚡ Job Portal App</text>
        <text x="12" y="32" class="sans" font-size="7.5" fill="#94A3B8">MERN Stack · Redux · Render</text>
        <rect x="12" y="40" width="45" height="12" rx="2" fill="#06221C"/>
        <text x="34" y="49" text-anchor="middle" class="sans" font-size="7" font-weight="600" fill="#27E6A2">Live Demo</text>

        <rect x="170" y="0" width="155" height="60" rx="6" fill="#091A2B" stroke="#1E3A52" stroke-width="1"/>
        <text x="182" y="18" class="sans" font-size="9" font-weight="700" fill="#38BDF8">🛒 QuickKart Platform</text>
        <text x="182" y="32" class="sans" font-size="7.5" fill="#94A3B8">Socket.io · Node · Express</text>
        <rect x="182" y="40" width="45" height="12" rx="2" fill="#0B253D"/>
        <text x="204" y="49" text-anchor="middle" class="sans" font-size="7" font-weight="600" fill="#38BDF8">Live Code</text>

        <rect x="340" y="0" width="155" height="60" rx="6" fill="#091A2B" stroke="#1E3A52" stroke-width="1"/>
        <text x="352" y="18" class="sans" font-size="9" font-weight="700" fill="#A855F7">📄 AI Resume Analyzer</text>
        <text x="352" y="32" class="sans" font-size="7.5" fill="#94A3B8">Next.js · ATS Scoring</text>
        <rect x="352" y="40" width="45" height="12" rx="2" fill="#25123D"/>
        <text x="374" y="49" text-anchor="middle" class="sans" font-size="7" font-weight="600" fill="#C084FC">Explore</text>
      </g>
    </g>
  </g>
</svg>
