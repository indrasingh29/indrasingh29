<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A2C"/>
      <stop offset="100%" stop-color="#030C16"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#27E6A2"/>
    </linearGradient>
    <pattern id="cardGrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#183044" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="600" height="260" rx="12" fill="url(#cardBg2)" stroke="#183044" stroke-width="1.5"/>
  <rect width="600" height="260" rx="12" fill="url(#cardGrid2)"/>

  <!-- Top Window Header -->
  <rect width="600" height="36" rx="12" fill="#0A2035" stroke="#183044" stroke-width="1"/>
  <rect y="24" width="600" height="12" fill="#0A2035"/>
  <circle cx="22" cy="18" r="4.5" fill="#FF5F56"/>
  <circle cx="36" cy="18" r="4.5" fill="#FFBD2E"/>
  <circle cx="50" cy="18" r="4.5" fill="#27C93F"/>
  <text x="70" y="22" class="mono" font-size="11" fill="#9CB0C8">indra-portfolio // github-pages</text>

  <!-- Status Pill -->
  <rect x="420" y="8" width="164" height="20" rx="10" fill="#061826" stroke="#22D3EE" stroke-width="1"/>
  <circle cx="432" cy="18" r="3.5" fill="#22D3EE"/>
  <text x="442" y="22" class="mono" font-size="9.5" fill="#22D3EE" font-weight="700">GITHUB PAGES LIVE</text>

  <!-- Project Icon / Graphic (Left side) -->
  <g transform="translate(36, 64)">
    <rect width="90" height="90" rx="16" fill="#0A2238" stroke="#27E6A2" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Web Browser & Modern Monogram Vector Icon -->
    <rect x="22" y="24" width="46" height="38" rx="4" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <line x1="22" y1="34" x2="68" y2="34" stroke="#183044" stroke-width="1.5"/>
    <circle cx="28" cy="29" r="1.8" fill="#27E6A2"/>
    <circle cx="34" cy="29" r="1.8" fill="#22D3EE"/>
    <path d="M 34 50 L 42 42 L 56 56" stroke="#27E6A2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="32" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Project Info (Right of Icon) -->
  <g transform="translate(144, 66)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="20" rx="4" fill="#061D2E" stroke="#22D3EE" stroke-width="0.8"/>
    <text x="8" y="14" class="mono" font-size="10" fill="#22D3EE" font-weight="700">REACT 19 · VITE · MOTION</text>

    <!-- Project Name -->
    <text x="0" y="44" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">Developer Portfolio</text>

    <!-- Description -->
    <text x="0" y="68" class="sans" font-size="12.5" fill="#9CB0C8">Premium Dark Glassmorphic Engineering Portfolio</text>

    <!-- Metrics / Key Highlights -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="134" height="22" rx="4" fill="#0A2136"/>
      <text x="6" y="15" class="mono" font-size="10" fill="#27E6A2">✓ Live GitHub REST API</text>

      <rect x="142" y="0" width="136" height="22" rx="4" fill="#0A2136"/>
      <text x="148" y="15" class="mono" font-size="10" fill="#27E6A2">✓ Glassmorphic UI/UX</text>

      <rect x="286" y="0" width="132" height="22" rx="4" fill="#0A2136"/>
      <text x="292" y="15" class="mono" font-size="10" fill="#27E6A2">✓ Interactive 3D Tilt</text>
    </g>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(36, 212)">
    <text x="0" y="16" class="mono" font-size="11" fill="#9CB0C8">STACK:</text>
    <rect x="52" y="0" width="76" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">React 19</text>

    <rect x="134" y="0" width="60" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="164" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Vite</text>

    <rect x="200" y="0" width="84" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="242" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Tailwind</text>

    <rect x="290" y="0" width="112" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="346" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Framer Motion</text>

    <rect x="408" y="0" width="84" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="450" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Lucide</text>

    <rect x="498" y="0" width="66" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="531" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#22D3EE">Pages</text>
  </g>

  <!-- Accent bottom glow line -->
  <rect x="0" y="257" width="600" height="3" fill="url(#cyanGrad2)"/>
</svg>
