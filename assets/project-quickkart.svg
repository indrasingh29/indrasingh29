<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="qkCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D2D"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <filter id="qkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <!-- Container -->
  <rect width="600" height="320" rx="14" fill="url(#qkCardBg)" stroke="#162E44" stroke-width="1.5"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(18, 16)" filter="url(#qkShadow)">
    <!-- Browser Frame -->
    <rect width="564" height="288" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="564" height="28" rx="10" fill="#1E293B"/>
    <rect y="18" width="564" height="10" fill="#1E293B"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="14" r="4" fill="#10B981"/>
    <!-- URL pill -->
    <rect x="140" y="6" width="284" height="16" rx="4" fill="#0F172A"/>
    <text x="282" y="18" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">quickkart.dev // live-shopping</text>

    <!-- App Content: Exact Recreation of E-Commerce Storefront in reference! -->
    <g transform="translate(0, 28)">
      <!-- Clean White/Cream Storefront Background -->
      <rect width="564" height="260" fill="#FCFCFD"/>

      <!-- Store Navbar -->
      <g transform="translate(24, 12)">
        <!-- QuickKart Brand -->
        <g transform="translate(0, 0)">
          <!-- Cart Icon -->
          <circle cx="6" cy="10" r="6" fill="#10B981"/>
          <path d="M 3 10 L 5 12 L 9 8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
          <text x="18" y="14" class="sans" font-size="13" font-weight="900" fill="#047857">QuickKart</text>
        </g>

        <!-- Search Bar -->
        <rect x="140" y="0" width="220" height="22" rx="11" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="156" y="14" class="sans" font-size="8.5" fill="#94A3B8">Search groceries, electronics, essentials...</text>

        <!-- User / Cart Stats -->
        <g transform="translate(420, 2)">
          <rect x="0" y="0" width="52" height="18" rx="4" fill="#ECFDF5"/>
          <text x="26" y="12" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="#047857">🛒 Cart (3)</text>
          <rect x="60" y="0" width="46" height="18" rx="4" fill="#047857"/>
          <text x="83" y="12" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="#FFFFFF">Profile</text>
        </g>
      </g>

      <!-- Main Promotional Hero Section -->
      <g transform="translate(24, 52)">
        <!-- Left Banner Text (As shown in screenshot: "Best Deals", "Best Products") -->
        <g transform="translate(8, 20)">
          <text x="0" y="24" class="sans" font-size="20" font-weight="900" fill="#0F172A">Best Deals</text>
          <text x="0" y="48" class="sans" font-size="20" font-weight="900" fill="#047857">Best Products</text>
          <text x="0" y="70" class="sans" font-size="9" fill="#64748B">Hyperlocal 15-Minute Instant Delivery</text>
          <rect x="0" y="82" width="90" height="24" rx="5" fill="#0F172A"/>
          <text x="45" y="97" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#FFFFFF">Shop Now →</text>
        </g>

        <!-- 3 Product Showcase Cards (From reference image: Rose Card, Yellow Headphones Card, Beige Watch Card) -->
        <!-- Card 1: Rose/Pink Accent Card -->
        <g transform="translate(190, 8)">
          <rect width="95" height="135" rx="8" fill="#FDF2F2" stroke="#FEE2E2" stroke-width="1"/>
          <!-- Product Illustration (Smart Speaker/Gadget) -->
          <circle cx="47" cy="48" r="26" fill="#F87171" fill-opacity="0.25"/>
          <rect x="36" y="30" width="22" height="36" rx="4" fill="#EF4444"/>
          <circle cx="47" cy="42" r="5" fill="#FFFFFF"/>
          <text x="12" y="96" class="sans" font-size="9" font-weight="700" fill="#1E293B">Wireless Pods</text>
          <text x="12" y="108" class="sans" font-size="8" fill="#64748B">Ultra Bass</text>
          <text x="12" y="124" class="sans" font-size="10" font-weight="800" fill="#047857">₹1,499</text>
          <rect x="64" y="112" width="22" height="16" rx="3" fill="#047857"/>
          <text x="75" y="123" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#FFFFFF">+</text>
        </g>

        <!-- Card 2: Warm Yellow Card with Over-Ear Headphones (Exact match from reference!) -->
        <g transform="translate(300, 8)">
          <rect width="105" height="135" rx="8" fill="#FEF9C3" stroke="#FEF08A" stroke-width="1"/>
          <!-- Headphones Illustration -->
          <g transform="translate(52, 48)">
            <!-- Headband -->
            <path d="M -22 0 A 22 22 0 0 1 22 0" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
            <!-- Ear Cups -->
            <rect x="-26" y="-4" width="8" height="20" rx="3" fill="#0F172A"/>
            <rect x="18" y="-4" width="8" height="20" rx="3" fill="#0F172A"/>
          </g>
          <text x="12" y="96" class="sans" font-size="9" font-weight="700" fill="#1E293B">Sony Studio ANC</text>
          <text x="12" y="108" class="sans" font-size="8" fill="#64748B">Noise Canceling</text>
          <text x="12" y="124" class="sans" font-size="10" font-weight="800" fill="#047857">₹4,999</text>
          <rect x="74" y="112" width="22" height="16" rx="3" fill="#047857"/>
          <text x="85" y="123" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#FFFFFF">+</text>
        </g>

        <!-- Card 3: Soft Amber/Beige Card (Smartwatch/Backpack) -->
        <g transform="translate(420, 8)">
          <rect width="95" height="135" rx="8" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1"/>
          <!-- Watch/Gadget Illustration -->
          <circle cx="47" cy="48" r="22" fill="#F59E0B" fill-opacity="0.2"/>
          <rect x="37" y="32" width="20" height="32" rx="4" fill="#D97706"/>
          <circle cx="47" cy="48" r="6" fill="#FEF3C7"/>
          <text x="12" y="96" class="sans" font-size="9" font-weight="700" fill="#1E293B">Fitness Watch</text>
          <text x="12" y="108" class="sans" font-size="8" fill="#64748B">OLED Heart Rate</text>
          <text x="12" y="124" class="sans" font-size="10" font-weight="800" fill="#047857">₹2,199</text>
          <rect x="64" y="112" width="22" height="16" rx="3" fill="#047857"/>
          <text x="75" y="123" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#FFFFFF">+</text>
        </g>
      </g>

      <!-- Bottom Socket.io Real-Time Telemetry Bar -->
      <g transform="translate(24, 214)">
        <rect width="516" height="32" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="16" r="3.5" fill="#10B981"/>
        <text x="32" y="20" class="sans" font-size="8.5" font-weight="600" fill="#0F172A">Socket.io Live Order Sync: <tspan fill="#047857">Order #QK-8492 is out for delivery (Rider ETA: 6 mins)</tspan></text>
        <rect x="424" y="8" width="80" height="16" rx="3" fill="#047857"/>
        <text x="464" y="19" text-anchor="middle" class="sans" font-size="7.5" font-weight="700" fill="#FFFFFF">Track Rider ⚡</text>
      </g>
    </g>
  </g>
</svg>
