<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A2C"/>
      <stop offset="100%" stop-color="#030C16"/>
    </linearGradient>
    <linearGradient id="mintGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27E6A2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="cardGrid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#183044" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="600" height="260" rx="12" fill="url(#cardBg3)" stroke="#183044" stroke-width="1.5"/>
  <rect width="600" height="260" rx="12" fill="url(#cardGrid3)"/>

  <!-- Top Window Header -->
  <rect width="600" height="36" rx="12" fill="#0A2035" stroke="#183044" stroke-width="1"/>
  <rect y="24" width="600" height="12" fill="#0A2035"/>
  <circle cx="22" cy="18" r="4.5" fill="#FF5F56"/>
  <circle cx="36" cy="18" r="4.5" fill="#FFBD2E"/>
  <circle cx="50" cy="18" r="4.5" fill="#27C93F"/>
  <text x="70" y="22" class="mono" font-size="11" fill="#9CB0C8">quickkart // micro-services-repo</text>

  <!-- Status Pill -->
  <rect x="424" y="8" width="160" height="20" rx="10" fill="#061826" stroke="#27E6A2" stroke-width="1"/>
  <circle cx="436" cy="18" r="3.5" fill="#27E6A2"/>
  <text x="446" y="22" class="mono" font-size="9.5" fill="#27E6A2" font-weight="700">DOCKER &amp; SOCKET.IO</text>

  <!-- Project Icon / Graphic (Left side) -->
  <g transform="translate(36, 64)">
    <rect width="90" height="90" rx="16" fill="#0A2238" stroke="#27E6A2" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Quick Commerce Shopping & Speed Vector Icon -->
    <path d="M 22 28 L 32 28 L 40 58 L 66 58 L 72 38 L 34 38" fill="none" stroke="#27E6A2" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="42" cy="68" r="4" fill="#22D3EE"/>
    <circle cx="64" cy="68" r="4" fill="#22D3EE"/>
    <!-- Lightning Bolt Accent -->
    <path d="M 52 24 L 44 38 L 52 38 L 48 50" fill="none" stroke="#27E6A2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="32" fill="none" stroke="#27E6A2" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Project Info (Right of Icon) -->
  <g transform="translate(144, 66)">
    <!-- Badge -->
    <rect x="0" y="0" width="198" height="20" rx="4" fill="#061D2E" stroke="#27E6A2" stroke-width="0.8"/>
    <text x="8" y="14" class="mono" font-size="10" fill="#27E6A2" font-weight="700">MERN · SOCKET.IO · COMMERCE</text>

    <!-- Project Name -->
    <text x="0" y="44" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">QuickKart</text>

    <!-- Description -->
    <text x="0" y="68" class="sans" font-size="12.5" fill="#9CB0C8">Hyperlocal Quick-Commerce with 3 Client Modules</text>

    <!-- Metrics / Key Highlights -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="134" height="22" rx="4" fill="#0A2136"/>
      <text x="6" y="15" class="mono" font-size="10" fill="#22D3EE">✓ 3 Apps: User/Admin/Rider</text>

      <rect x="142" y="0" width="138" height="22" rx="4" fill="#0A2136"/>
      <text x="148" y="15" class="mono" font-size="10" fill="#22D3EE">✓ Real-Time Socket.io</text>

      <rect x="288" y="0" width="130" height="22" rx="4" fill="#0A2136"/>
      <text x="294" y="15" class="mono" font-size="10" fill="#22D3EE">✓ Razorpay-Ready</text>
    </g>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(36, 212)">
    <text x="0" y="16" class="mono" font-size="11" fill="#9CB0C8">STACK:</text>
    <rect x="52" y="0" width="60" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">React</text>

    <rect x="118" y="0" width="70" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="153" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Node.js</text>

    <rect x="194" y="0" width="80" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="234" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Socket.io</text>

    <rect x="280" y="0" width="84" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="322" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">MongoDB</text>

    <rect x="370" y="0" width="72" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="406" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#E8F0FA">Docker</text>

    <rect x="448" y="0" width="116" height="24" rx="4" fill="#0A2238" stroke="#183044" stroke-width="1"/>
    <text x="506" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#27E6A2">Express API</text>
  </g>

  <!-- Accent bottom glow line -->
  <rect x="0" y="257" width="600" height="3" fill="url(#mintGrad3)"/>
</svg>
